<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Ghibli</title>
		<link rel="stylesheet" href="ghibli.css" />
	</head>
	<body class="theme">
		<header>
			<div class="menu-left">
				<nav>
					<img src="logo.png" alt="logo" />
					<a href="netflix.html">Home</a>
					<a href="netflix.html">Series</a>
					<a href="netflix.html">Movie</a>
					<a href="netflix.html">Game</a>
					<a href="netflix.html">Latest content</a>
					<a href="netflix.html">My Wishlist</a>
					<a href="netflix.html">Browse by language</a>
				</nav>
			</div>

			<div class="menu-right">
				<input
					class="search"
					type="text"
					name="search"
					placeholder="Search.."
				/>
				<a href="netflix.html">Kids</a>
				<img src="bell.png" alt="notification" />
				<img src="profile.webp" />
			</div>
		</header>
		<section class="hero">
			<iframe
				width="100%"
				height="700px"
				src="https://www.youtube.com/embed/RzSpDgiF5y8?autoplay=1&mute=1&loop=1&playlist=RzSpDgiF5y8"
				title="YouTube video player"
				frameborder="0"
				allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
				allowfullscreen
			></iframe>

			<div class="hero-overlay">
				<h1>Studio Ghibli</h1>
				<p>Explore the magical world of anime films</p>
				<button>Watch Now</button>
			</div>
		</section>

		<div>
			<p id="title">Studio Ghibli Films</p>
		</div>

		<div class="container"></div>

		<script>
			const container = document.querySelector(".container");

			function getMovies() {
				fetch(`https://ghibliapi.vercel.app/films`)
					.then((res) => {
						if (!res.ok) throw new Error("Movies not found, API wrong");
						return res.json();
					})
					.then((movies) => {
						movies.forEach((movie) => {
							const list = document.createElement("div");
							list.classList.add("movieContainer");

							list.innerHTML = `
              <img src="${movie.image}" alt="${movie.title}"/>
              <div class="overlay">
                <h3>${movie.title}</h3>
                <p class="desc">${movie.description.substring(0, 120)}...</p>
                <div class="details">
                  <span> ${movie.release_date}</span>
                  <span> ${movie.director}</span>
                  <span> ${movie.running_time} min</span>
                </div>
              </div>
            `;

							container.appendChild(list);
						});
					})
					.catch((err) => console.error(err));
			}

			getMovies();

			const searchInput = document.querySelector(".search");

			searchInput.addEventListener("input", (e) => {
				const searchValue = e.target.value.toLowerCase();
				const movies = document.querySelectorAll(".movieContainer");

				movies.forEach((movie) => {
					const title = movie.querySelector("h3").textContent.toLowerCase();
					const description = movie
						.querySelector("p")
						.textContent.toLowerCase();

					if (
						title.includes(searchValue) ||
						description.includes(searchValue)
					) {
						movie.style.display = "block";
					} else {
						movie.style.display = "none";
					}
				});
			});
		</script>
	</body>
</html>
