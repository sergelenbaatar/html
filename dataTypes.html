			let age = 25; //number

			let numbers = [1, 2, 3, 4, 5]; //array

				name: "Chris",

			function nemeh(a, b) {

			//ex1
			function isEven(a) {
				return a % 2 === 0;
			}
			let Evenresult = isEven(7);
			console.log(Evenresult);
			//ex2
			function divider(a, b) {
				let nogdvor = a / b;
				let uldegdel = a % b;
				return { nogdvor, uldegdel };
			}
			console.log(divider(11, 2));
			//ex3
			function highestNumber(a, b) {
				if (a > b) {
					return a;
				} else {
					return b;
				}
			}
			console.log(highestNumber(15, 10));
			//ex4
			function isLeapYear(a) {
				if ((a % 4 === 0 && a % 100 !== 0) || a % 400 === 0) {
					return true;
				} else {
					return false;
				}
			}
			console.log(isLeapYear(404));
			//ex5
			function highestNumber2(a, b, c) {
				if (a > b && a > c) {
					return a;
				}
				if (b > a && b > c) {
					return b;
				} else {
					return c;
				}
			}
			console.log(highestNumber2(10, 34, 20));
