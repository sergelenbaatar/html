<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
	</head>
	<body>
		<script>
			//ex1
			const colors = ["red", "green", "blue", "pink", "yellow"];
			console.log(colors[2]);

			//ex2
			const animals = ["Lion", "Tiger", "Elephant", "Giraffe"];
			animals[1] = "Panda";
			console.log(animals);

			//ex3
			const books = ["1984", "Brave New Wold", "Fahrenheit 451"];
			books.push("Bluemark", "Secret");
			console.log(books);

			//ex4
			const numbers = [10, 20, 30, 40, 50];
			console.log(numbers.indexOf(30));

			//ex5
			const fruits1 = ["apple", "banana", "cherry"];
			const fruits2 = ["kiwi", "mango", "grape"];
			const allFruit = fruits1.concat(fruits2);
			console.log(allFruit);

			//ex6
			const color = ["Red", "Green", "Blue", "Yellow", "Purple"];
			console.log(color.includes("Red"));
			console.log(color.includes("Green"));
			console.log(color.includes("Blue"));
			console.log(color.includes("Yellow"));
			console.log(color.includes("Purple"));
			console.log(color.includes("Black"));

			//ex7
			const array1 = ["a", "b", "c", "d"];
			const array2 = ["a", "b", "c"];
			const equalLength = function () {
				return array1.length === array2.length;
			};
			console.log(equalLength(array1, array2));

			//ex8
			const words = ["JavaScript", "is", "a", "versatile", "language"];
			console.log(words.toString());

			//9-1
			const students = [
				{ name: "Anu", grade: 85 },
				{ name: "Bold", grade: 92 },
				{ name: "Tuvshin", grade: 78 },
				{ name: "Naraa", grade: 88 },
				{ name: "Solongo", grade: 95 },
			];
			const topStudents = [];

			students.forEach(function (student) {
				if (student.grade > 90) {
					return topStudents.push(student);
				}
			});
			console.log(topStudents);

			console.log(
				"Onoo buurahaar:",
				students.sort((x, y) => y.grade - x.grade)
			);

			let highestGrade = 0;

			students.forEach((student) => {
				if (student.grade > highestGrade) {
					highestGrade = student.grade;
				}
			});

			console.log("highest", highestGrade);
			let highestStudent = students.find(
				(student) => student.grade == highestGrade
			);
			console.log(highestStudent);

			//9-2
			const products = [
				{ id: 1, name: "Laptop", price: 2500 },
				{ id: 2, name: "Mouse", price: 25 },
				{ id: 3, name: "Monitor", price: 400 },
				{ id: 4, name: "Keyboard", price: 100 },
				{ id: 5, name: "Phone", price: 1200 },
			];

			const cheapProductNames = [];
			products.forEach(function (product) {
				if (product.price < 500) return cheapProductNames.push(product);
			});
			console.log(cheapProductNames);

			console.log(
				"Une usuhuur:",
				products.sort((x, y) => x.price - y.price)
			);

			//9-4
			const broduct = [
				{ id: 101, name: "Laptop", prices: [2000, 2100, 1900] },
				{ id: 102, name: "Mouse", prices: [25, 27, 24] },
				{ id: 103, name: "Keyboard", prices: [100, 110, 90] },
				{ id: 104, name: "Laptop", prices: [1950, 1980, 2000] },
				{ id: 105, name: "Monitor", prices: [400, 390, 410] },
			];

			broducts.forEach((broduct) => {
				const sum = broduct.prices.reduce((total, price) => total + price, 0);
				const average = sum / broduct.prices.length;
				broduct.averagePrice = average;
			});
			console.log(broducts);
		</script>
	</body>
</html>
