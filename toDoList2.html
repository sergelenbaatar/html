<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="todoList2.css" />
		<title>Document</title>
	</head>
	<body>
		<div class="">
			<h2>To Do:</h2>
            <div class="input-section">
                <input type="text" id="taskInput" placeholder="Task name">
                <button onclick="addTask()">Add</button>
			<table id="taskTable">
				<thead>
					<tr>
						<th>Name</th>
						<th>Status</th>
						<th>Action</th>
					</tr>
				</thead>
				<tbody id="taskList"></tbody>
			</table>
		</div>

		<script>

        function addTask () {
                        const name = document.getElementById("taskName").value;
                        const status = parseFloat(document.getElementById("taskStatus").value);
                        const action = parseInt(
                            document.getElementById("taskAction").value
                        );

                        if (!task || isNaN(status) || isNaN(action)) {
                            alert("Please fill in all fields correctly.");
                            return;
                        }

                        const task  = new Task(name, status, action);
                        
                        inventory.addTask(task);
                        console.log(inventory, "");
                        updateDisplay();
                    }

                    function updateDisplay() {
                        const tableBody = document.querySelector("#inventoryTable tbody");
                        tableBody.innerHTML = "";

                        inventory.getItems().forEach((item, index) => {
                            const row = document.createElement("tr");

                            row.innerHTML = `
                <td>${index + 1}</td>
                <td>${item.name}</td>
                <td>${item.price.toFixed(2)}</td>
                <td>${item.quantity}</td>
                <td>${item.getTotalPrice().toFixed(2)}</td>
                `;

                            tableBody.appendChild(row);
                        });

                        document.getElementById("totalValue").textContent = inventory
                            .getInventoryValue()
                            .toFixed(2);
                    }
        </script>
	</body>
</html>
