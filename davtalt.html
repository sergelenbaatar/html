<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
	</head>
	<body>
		<script>
			//ex1
			for (let i = 0; i < 101; i++) {
				console.log(i);
			}

			//ex2
			let fruits = ["apple", "banana", "mango", "orange", "strawberry"];
			for (let i = 0; i < 5; i++);
			{
				console.log("ex2:", fruits);
			}

			//Ex3
			const cars = ["BMW", "Volvo", "Saab", "Ford", "Fiat", "Audi"];
			for (let i = 0; i < fruits.length; i += 2) {
				console.log("ex3: ", cars[i]);
			}

			//Ex4
			let sum = 0;
			for (let i = 0; i <= 10; i++) {
				sum += i;
			}
			console.log("ex4: ", sum);

			//Ex1
			let i = 0;
			while (i <= 100) {
				if (i % 2 !== 0) {
					console.log("Ex1:", i);
				}
				i++;
			}

			//Ex2
			let a = 1;
			while (a <= 100) {
				if (a % 2 === 0) {
					console.log("Ex2:", a);
				}
				a++;
			}

			// Ex3
			let num3 = 1;
			let sum2 = 0;
			while (num3 <= 100) {
				sum2 += num3;
				if (sum2 > 100) {
					console.log("Exercise", sum2);
					break;
				}
				num3++;
			}

			//Ex4
			let d = 1;
			while (d <= 50) {
				if (d % 3 === 0) {
					console.log("Ex4:", d);
				}
				d++;
			}

			// "Ex5
			let numbers = [1, 3, 5, 7, 8, 9, 11];
			let condition = 0;
			while (numbers.length > condition) {
				if (numbers[condition] % 2 == 0) {
					console.log(numbers[condition]);
					break;
				}
				condition++;
			}
		</script>
	</body>
</html>
