<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Variable</title>
	</head>
	<body>
		<script>
			//1:
			let a1 = 3;
			let b1 = 4;
			let c1 = 5;
			console.log(a1 + b1 + c1);
			//2:
			let a2 = 12;
			let b2 = 13;
			console.log(a2 + b2);
			//3:
			let a3 = 5;
			console.log(a3 * a3 * a3);
			console.log(a3 * a3 * 6);
			//4:
			let a4 = 6;
			let b4 = 4;
			console.log(a4 * b4);
			console.log((a4 + b4) * 2);
			//5:
			let x = 1;
			let y = 3 * x - 5;
			console.log(y);
			//6:
			let x1 = -2;
			let y1 = 4 * x1 ** 2 - 3 * x + 5;
			console.log(y1);
			//7:
			let a7 = 493;
			let b7 = a7 % 100;
			let c7 = b7 % 10;
			console.log((b7 - c7) / 10);
			//8:
			let a8 = 27;
			let b8 = 27 % 10;
			let c8 = (a8 - b8) / 10;
			console.log(b8 * c8);
			//9:
			let a9 = 123;
			let b9 = a9 % 100;
			let c9 = b9 % 10;
			let d9 = (b9 - c9) % 10;
			let e9 = (a9 - b9) / 100;
			console.log(e9 + d9 + c9);
			//10:
			const a10 = 30;
			let b10 = 10;
			let c10 = a10 - b10;
			console.log(a10 - c10);
			console.log(c10);
			z10 = 50;
			m10 = c10 + z10;
			console.log(m10);
			if (m10 % 2 == 0) {
				console.log("Tegsh");
			} else {
				console.log("Sondgoi");
			}
		</script>
	</body>
</html>
