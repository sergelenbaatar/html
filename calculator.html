<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Calculator</title>
		<link rel="stylesheet" href="calculator.css" />
	</head>

	<body>
		<div class="mainContainer">
			<div class="container">
				<div id="input"></div>
				<div class="buttonsContainer">
					<div class="row">
						<button class="btn number" onclick="handleNumberButton(1)">
							1
						</button>
						<button class="btn number" onclick="handleNumberButton(2)">
							2
						</button>
						<button class="btn number" onclick="handleNumberButton(3)">
							3
						</button>
						<button class="btn operator" onclick="handleOperatorButton('+')">
							+
						</button>
					</div>
					<div class="row">
						<button class="btn number" onclick="handleNumberButton(4)">
							4
						</button>
						<button class="btn number" onclick="handleNumberButton(5)">
							5
						</button>
						<button class="btn number" onclick="handleNumberButton(6)">
							6
						</button>
						<button class="btn operator" onclick="handleOperatorButton('-')">
							-
						</button>
					</div>
					<div class="row">
						<button class="btn number" onclick="handleNumberButton(7)">
							7
						</button>
						<button class="btn number" onclick="handleNumberButton(8)">
							8
						</button>
						<button class="btn number" onclick="handleNumberButton(9)">
							9
						</button>
						<button class="btn operator" onclick="handleOperatorButton('*')">
							*
						</button>
					</div>
					<div class="row">
						<button class="btn number" onclick="handleNumberButton(0)">
							0
						</button>
						<button class="btn clear" onclick="handleClearButton()">C</button>
						<button class="btn calc" onclick="calc()">=</button>
						<button class="btn operator" onclick="handleOperatorButton('/')">
							/
						</button>
					</div>
				</div>
			</div>
		</div>
	</body>
	<script>
		let firstValue, secondValue, operator, answer;
		let step = 1;

		const input = document.querySelector("#input");

		function handleNumberButton(key) {
			input.innerHTML = input.innerHTML + key;
		}

		function handleOperatorButton(key) {
			operator = key;
			if (step === 1) {
				firstValue = parseFloat(input.innerHTML);
				input.innerHTML = "";
				step = 2;
			}
			if (step === 2) {
				secondValue = parseFloat(input.innerHTML);
				step = 1;
			}
		}

		function handleClearButton() {
			firstValue = 0;
			secondValue = 0;
			operator = undefined;
			step = 1;
			input.innerHTML = "";
		}

		function calc() {
			secondValue = parseFloat(input.innerHTML);

			switch (operator) {
				case "+":
					answer = firstValue + secondValue;
					break;
				case "-":
					answer = firstValue - secondValue;
					break;
				case "*":
					answer = firstValue * secondValue;
					break;
				case "/":
					answer = firstValue / secondValue;
					break;
				default:
					answer = parseFloat(input.innerHTML);
			}

			input.innerHTML = answer;
		}
	</script>
</html>
